# Project commands. This is the ONE file to edit when you start a new project
# from this template. Agents, hooks, and CI all read these through
# scripts/check.sh, so nothing else needs to change.
#
# Leave a value empty to skip that step (check.sh prints a warning).
# Examples:
#   Python:  SETUP_CMD="python3 -m pip install -e '.[dev]'"
#            LINT_CMD="ruff check ."
#            TEST_CMD="pytest -q"
#   Node:    SETUP_CMD="npm install"
#            LINT_CMD="npm run lint"
#            TEST_CMD="npm test"
#            BUILD_CMD="npm run build"

# Installs dependencies. Run at session start and in CI.
SETUP_CMD=""

# Static checks: linter, formatter check, and type checker.
LINT_CMD=""

# The automated test suite. This is an example test that checks
# scripts/check.sh itself; replace it with the project's real suite.
TEST_CMD="bash tests/check_test.sh"

# Compile or bundle step, if the project has one.
BUILD_CMD=""

# Space-separated files that decide what SETUP_CMD installs (lockfiles and
# manifests). The session start hook reruns setup only when one of them changes.
# Example: SETUP_INPUTS="package.json package-lock.json"
SETUP_INPUTS=""
